<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Что приготовить?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🍳 Что приготовить?</h1>
    <p class="subtitle">Введи продукты, которые есть — покажу рецепты</p>
  </header>

  <main>
    <section class="input-block">
      <div class="input-row">
        <input
          type="text"
          id="productInput"
          placeholder="Например: курица"
          autocomplete="off"
        >
        <button id="addBtn">Добавить</button>
      </div>
      <div id="productsList" class="products-list"></div>
      <button id="clearBtn" class="clear-btn">Очистить всё</button>
    </section>

    <section class="results-block">
      <h2>Подходящие рецепты</h2>
      <div id="results"></div>
    </section>
  </main>

  <script src="data/recipes.js"></script>
  <script src="storage.js"></script>
  <script src="matcher.js"></script>
  <script src="app.js"></script>
</body>
</html>
